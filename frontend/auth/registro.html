
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Dermavital</title>

    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <!-- Encabezado -->
    <header class="auth-header">

        <a href="../index.html" class="auth-logo">
            <img src="../assets/img/logo.png" alt="Dermavital">
        </a>

        <nav class="auth-nav">
            <a href="../index.html">Inicio</a>
            <a href="../index.html#nosotros">Nosotros</a>
            <a href="../index.html#servicios">Servicios</a>
            <a href="../index.html#contacto">Contacto</a>
        </nav>

        <a href="login.html" class="auth-login-link">
            Iniciar sesión
        </a>

    </header>

    <!-- Contenido principal -->
    <main class="auth-main">

    <!-- Columna izquierda: imagen -->
    <section class="auth-image">

        <div class="auth-image-content">
            

             <img src="../assets/img/skin-care.jpg"
             alt="Logo Dermavital"
             class="auth-vertical-logo">

           
        </div>

    </section>

    <!-- Columna derecha: formulario -->
    <section class="auth-form-section">

        <div class="auth-card">

            <div class="auth-heading">

                <span class="auth-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </span>

                <h1>Crear una cuenta</h1>

                <p>
                    Regístrate y comienza a cuidar tu piel.
                </p>

            </div>

            <form id="registroForm">

                <div class="form-group">
                    <label for="nombre_usuario">Nombre completo</label>

                    <div class="input-container">
                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="nombre_usuario"
                            name="nombre_usuario"
                            placeholder="Escribe tu nombre completo"
                            maxlength="100"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="correo_usuario">Correo electrónico</label>

                    <div class="input-container">
                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="correo_usuario"
                            name="correo_usuario"
                            placeholder="ejemplo@correo.com"
                            maxlength="150"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password_usuario">Contraseña</label>

                    <div class="input-container">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password_usuario"
                            name="password_usuario"
                            placeholder="Mínimo 8 caracteres"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password_usuario"
                            aria-label="Mostrar contraseña"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmar_password">
                        Confirmar contraseña
                    </label>

                    <div class="input-container">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmar_password"
                            name="confirmar_password"
                            placeholder="Repite tu contraseña"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmar_password"
                            aria-label="Mostrar contraseña"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="authMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite">
                </div>

                <button type="submit" class="auth-submit">
                    Crear cuenta
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="auth-footer">
                <p>
                    ¿Ya tienes una cuenta?
                    <a href="login.html">Inicia sesión</a>
                </p>
            </div>

        </div>

    </section>

</main>


    <!-- Pie de página -->
    <footer class="auth-page-footer">
        <p>
            © 2026 Dermavital. Todos los derechos reservados.
        </p>
    </footer>

    <!-- JavaScript -->
    <script src="js\registro.js"></script>

</body>
</html>
